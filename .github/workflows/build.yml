---
name: Build

on:
  push:
    branches: [master]
    paths:
      - systemd-manager@hardpixel.eu/**
      - package.json
      - yarn.lock
      - rollup.config.js
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [22.0, 24.0]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run build
        run: yarn build
